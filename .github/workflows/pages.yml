name: Deploy web app to GitHub Pages

# 把 fitness/ 目录发布成静态站点：https://<user>.github.io/<repo>/
# 触发条件：main 分支上 fitness/ 或本文件有改动，也可以手动触发

on:
  push:
    branches: [main]
    paths:
      - 'fitness/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库还没在 Settings → Pages 里开启时，尝试自动开启（免去手动改 Source）
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./fitness

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
